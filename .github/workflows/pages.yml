name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # refresh the news every 3 hours (the SEC snapshot is rebuilt on each run too)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site && cp -r index.html crypto.html markets.html portfolio.html invest.html styles.css src fonts _site/
          # Cache-bust: stamp the commit into asset URLs so browsers never mix old and new files.
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/*.html _site/src/*.js
      - name: Switch on accounts (Supabase)
        # The URL and the anon/publishable key are public by design (row-level security protects the data),
        # so they live in repository variables, not secrets. Without them the site keeps data in the browser.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|__SUPABASE_URL__|${SUPABASE_URL%/}|; s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|" _site/src/config.js
            echo "Accounts on"
          else
            echo "No SUPABASE_URL / SUPABASE_ANON_KEY variables: accounts stay off"
          fi
      - name: Fetch news headlines
        # The CryptoPanic key stays in a repository secret; only the resulting headlines are published.
        env:
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
        run: node scripts/fetch-news.mjs _site/news.json
      - name: Build the stocks & ETFs snapshot (SEC EDGAR)
        # SEC asks automated clients for a contact; it is kept in a repository secret.
        # If SEC can't be reached, keep serving the last published snapshot instead of failing the deploy.
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          ALPHAVANTAGE_PUBLISH: ${{ vars.ALPHAVANTAGE_PUBLISH }}
        run: |
          node scripts/fetch-markets.mjs _site/markets.json || curl -fsS -o _site/markets.json https://angelito10-png.github.io/assetlens/markets.json || echo "No markets snapshot this run"
      - name: Build the crypto score backtest (CoinGecko, weekly)
        # Rebuilt at most once a week (the script keeps the published file while it is under 6 days old).
        # The public CoinGecko API is slow on purpose, so this can take a few minutes; it never fails the deploy.
        run: |
          curl -fsS -o prev-backtest.json https://angelito10-png.github.io/assetlens/backtest.json || rm -f prev-backtest.json
          timeout 20m node scripts/fetch-backtest.mjs _site/backtest.json prev-backtest.json || cp prev-backtest.json _site/backtest.json || echo "No backtest this run"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
